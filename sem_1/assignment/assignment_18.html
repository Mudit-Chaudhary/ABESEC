<!DOCTYPE html>
<html lang="en">
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>ABC College Admission 2026</title>
		<style>
			body { margin: 0; font-family: Arial, sans-serif; }
			header, footer { background: #1a238f; color: #fff; text-align: center; padding: 20px; }
			header h1 { margin: 0; }
			main { max-width: 640px; margin: 20px auto; padding: 0 16px; }
			table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
			caption { padding-bottom: 6px; }
			th, td { border: 1px solid #999; padding: 8px; text-align: left; }
			thead th { background: #c4c5cc; text-align: center; }
			fieldset { border: 1px solid #555; padding: 16px; }
			label { display: block; margin-top: 12px; }
			input, select, textarea { margin-top: 4px; }
			input[type="text"], input[type="email"] { width: 300px; }
			textarea { width: 100%; max-width: 480px; height: 80px; }
			button { margin-top: 16px; padding: 6px 16px; }
		</style>
	</head>
	<body>
		<header>
			<h1>ABC College Admission 2026</h1>
		</header>
		<main>
			<section>
				<h2>Courses and Fees</h2>
				<table>
					<caption>Available Courses</caption>
					<thead>
						<tr>
							<th>Course</th>
							<th>Seats</th>
							<th>Fees</th>
						</tr>
					</thead>
					<tbody>
						<tr>
							<td>B.Tech CSE</td>
							<td>120</td>
							<td>&#8377;90,000</td>
						</tr>
						<tr>
							<td>BCA</td>
							<td>60</td>
							<td>&#8377;45,000</td>
						</tr>
					</tbody>
				</table>
			</section>
			<section>
				<form method="post" action="#">
					<fieldset>
						<legend>Application Form</legend>
						<label for="name">Name:</label>
						<input type="text" id="name" name="name" required>
						<label for="email">Email:</label>
						<input type="email" id="email" name="email" required>
						<label for="course">Course:</label>
						<select id="course" name="course">
							<option>B.Tech CSE</option>
							<option>BCA</option>
						</select>
						<label for="statement">Statement:</label>
						<textarea id="statement" name="statement" required></textarea>
						<button type="submit">Apply</button>
					</fieldset>
				</form>
			</section>
		</main>
		<footer>
			<p>&copy; 2026 ABC College</p>
		</footer>
	</body>
</html>
