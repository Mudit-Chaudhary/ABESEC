<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Weekly Timetable</title>
		<style>
			table { border-collapse: collapse; }
			th, td { border: 1px solid #000; padding: 8px 14px; text-align: center; }
			caption { font-weight: bold; padding-bottom: 4px; }
		</style>
	</head>
	<body>
		<table>
			<caption>Weekly Timetable</caption>
			<thead>
				<tr>
					<th>Day</th>
					<th>9-10</th>
					<th>10-11</th>
					<th>11-12</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td>Mon</td>
					<td>Maths</td>
					<td>HTML</td>
					<td rowspan="2">Web Lab</td>
				</tr>
				<tr>
					<td>Tue</td>
					<td>DBMS</td>
					<td>OS</td>
				</tr>
				<tr>
					<td>Wed</td>
					<td colspan="3">Seminar</td>
				</tr>
			</tbody>
		</table>
	</body>
</html>
